<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">规则ID</label>
        <div class="layui-input-inline">
            <input name="id" value="{$get.id|default=''}" placeholder="请输入规则ID"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">规则类型</label>
        <div class="layui-input-inline">
            <select name="rule_type" class="layui-select">
                <option value="">所有类型</option>
                {foreach $rule_types as $key=>$item}
                <option value="{$key}" {if isset($get.rule_type) && $get.rule_type==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">规则名称</label>
        <div class="layui-input-inline">
            <input name="rule_name" value="{$get.rule_name|default=''}" placeholder="请输入规则名称"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <select name="enabled" class="layui-select">
                <option value="">全部</option>
                <option value="1" {if isset($get.enabled) && $get.enabled=='1'}selected{/if}>启用</option>
                <option value="0" {if isset($get.enabled) && $get.enabled=='0'}selected{/if}>禁用</option>
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline">
            <input name="date_range" value="{$get.date_range|default=''}" placeholder="请选择日期范围"
                   class="layui-input" id="date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增规则</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form;
        var laydate = layui.laydate;

        // 初始化日期范围选择器
        laydate.render({
            elem: '#date_range',
            type: 'date',
            range: ' - ',
            format: 'yyyy-MM-dd'
        });
    });
</script>
