<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">账号ID</label>
        <div class="layui-input-inline">
            <input name="id" value="{$get.id|default=''}" placeholder="请输入账号ID"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">渠道</label>
        <div class="layui-input-inline">
            <select name="vendor" class="layui-select">
                <option value="">所有渠道</option>
                {foreach $vendors as $vendor}
                <option value="{$vendor}" {if isset($get.vendor) && $get.vendor==$vendor}selected{/if}>{$vendor}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">账号类型</label>
        <div class="layui-input-inline">
            <select name="account_type" class="layui-select">
                <option value="">所有类型</option>
                {foreach $account_types as $type}
                <option value="{$type}" {if isset($get.account_type) && $get.account_type==$type}selected{/if}>{$type}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">市场账号ID</label>
        <div class="layui-input-inline">
            <input name="market_account_id" value="{$get.market_account_id|default=''}" placeholder="请输入市场账号ID"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">描述</label>
        <div class="layui-input-inline">
            <input name="desc" value="{$get.desc|default=''}" placeholder="请输入描述"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">状态</label>
        <div class="layui-input-inline">
            <select name="status" class="layui-select">
                <option value="">所有状态</option>
                {foreach $statuses as $key=>$item}
                <option value="{$key}" {if isset($get.status) && $get.status==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline">
            <input name="date_range" value="{$get.date_range|default=''}" placeholder="请选择日期范围"
                   class="layui-input" id="date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增账号</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form;
        var laydate = layui.laydate;

        // 初始化日期范围选择器
        laydate.render({
            elem: '#date_range',
            type: 'date',
            range: ' - ',
            format: 'yyyy-MM-dd'
        });
    });
</script>
