<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="id" value="{$get.id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品名称</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="product_name" value="{$get.product_name|default=''}" placeholder="模糊" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">类型</label>
            <div class="layui-input-inline" style="width:110px;">
                <select name="product_type">
                    <option value="">全部</option>
                    {foreach $types as $type}
                    <option value="{$type}" {if isset($get.product_type) && $get.product_type==$type}selected{/if}>{$type}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">期限</label>
            <div class="layui-input-inline" style="width:100px;">
                <select name="term">
                    <option value="">全部</option>
                    {foreach $terms as $term}
                    <option value="{$term}" {if isset($get.term) && $get.term==$term}selected{/if}>{$term}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">币种</label>
            <div class="layui-input-inline" style="width:100px;">
                <select name="funding_symbol">
                    <option value="">全部</option>
                    {foreach $symbols as $sym}
                    <option value="{$sym}" {if isset($get.funding_symbol) && $get.funding_symbol==$sym}selected{/if}>{$sym}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline" style="width:100px;">
                <select name="status">
                    <option value="">全部</option>
                    {foreach $statuses as $sk=>$sl}
                    <option value="{$sk}" {if isset($get.status) && $get.status==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
        <div class="layui-form-item layui-inline">
            <button type="button" class="layui-btn layui-btn-normal"
                    data-modal='{:url("add")}' data-width="680px" data-title="添加产品">
                <i class="layui-icon">&#xe654;</i> 添加产品
            </button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
