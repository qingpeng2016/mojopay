<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">关联产品</label>
            <div class="layui-input-block">
                <select name="product_id" id="ba-add-product" lay-search required>
                    <option value="">请选择未绑定子账号的产品</option>
                    {foreach $products as $p}
                    <option value="{$p.id}" data-code="{$p.product_code|default=''}">
                        #{$p.id} {$p.product_code|default=''} · {$p.product_name|default=''}
                    </option>
                    {/foreach}
                </select>
                {if empty($products)}
                <div class="layui-form-mid layui-word-aux" style="color:#c00;">暂无可绑定产品，请先在「产品列表」添加产品</div>
                {/if}
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">展示名</label>
            <div class="layui-input-block">
                <input name="account_name" id="ba-add-account-name" required maxlength="128"
                       placeholder="默认可与产品编码一致" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">平台标识</label>
            <div class="layui-input-block">
                <input name="external_subaccount_id" required maxlength="128"
                       placeholder="Bitfinex 子账号 ID 或别名" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">accounts_id</label>
            <div class="layui-input-block">
                <input name="accounts_id" maxlength="20" placeholder="策略引擎 accounts.id，可选" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">API Key</label>
            <div class="layui-input-block">
                <input name="api_key" required maxlength="128" autocomplete="off" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">API Secret</label>
            <div class="layui-input-block">
                <input name="api_secret" type="password" required maxlength="512" autocomplete="new-password" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    {foreach $statuses as $sk=>$sl}
                    <option value="{$sk}" {if isset($vo.status) && $vo.status==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" maxlength="500" class="layui-textarea" placeholder="可选"></textarea>
            </div>
        </div>
        <div class="layui-form-mid layui-word-aux" style="padding-left:110px;margin-bottom:12px;">
            保存后将自动写入 fund_products.bitfinex_sub_account_id；USD/USDT 余额由策略任务同步。
        </div>
        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit" {if empty($products)}disabled{/if}>保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
    $('#ba-add-product').on('change', function () {
        var code = $(this).find('option:selected').data('code') || '';
        if (code && !$('#ba-add-account-name').val()) {
            $('#ba-add-account-name').val(code);
        }
    });
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
