<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off" id="fb-search-form">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">快照时间</label>
            <div class="layui-input-inline" style="width:220px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="默认近 30 天；导出最多 1 个月" class="layui-input" id="fb-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="id" value="{$get.id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">币种</label>
            <div class="layui-input-inline" style="width:100px;">
                <select name="symbol">
                    <option value="">全部</option>
                    {foreach $symbols as $sk=>$sl}
                    <option value="{$sk}" {if isset($get.symbol) && $get.symbol==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">精度</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="book_prec" value="{$get.book_prec|default=''}" placeholder="如 P0" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">深度</label>
            <div class="layui-input-inline" style="width:80px;">
                <input name="book_len" value="{$get.book_len|default=''}" placeholder="len" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
        <div class="layui-form-item layui-inline">
            <button type="button" id="fb-btn-export" class="layui-btn layui-btn-normal">
                <i class="layui-icon">&#xe601;</i> 导出 CSV
            </button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({ elem: '#fb-date-range', type: 'date', range: ' - ', format: 'yyyy-MM-dd' });
});
</script>
