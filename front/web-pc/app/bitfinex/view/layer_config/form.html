<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">币种</label>
            <div class="layui-input-block" style="padding-top:9px;">
                {if isset($vo.symbol) && $vo.symbol eq 'fUST'}
                <span class="layui-badge layui-bg-orange">fUST</span>
                {elseif isset($vo.symbol) && $vo.symbol eq 'fUSD'}
                <span class="layui-badge layui-bg-blue">fUSD</span>
                {else}
                <span class="layui-badge layui-bg-gray">{$vo.symbol|default='-'}</span>
                {/if}
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">层级</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.layer_code_label|default=''} ({$vo.layer_code|default=''})" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">占比</label>
            <div class="layui-input-block">
                <input name="weight_ratio" value="{$vo.weight_ratio_fmt|default=''}" required placeholder="如 0.2500" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">利率阶梯</label>
            <div class="layui-input-block">
                <textarea name="rate_multipliers" required placeholder='JSON 数组，如 [0.96, 0.98, 1.0]；[] 表示不参与挂单' class="layui-textarea mono json-field">{$vo.rate_multipliers_display|raw}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">期限配置</label>
            <div class="layui-input-block">
                <textarea name="period_days" required placeholder='[{"days":2,"weight":0.5},...] 或 {"splits":[...]}' class="layui-textarea mono json-field">{$vo.period_days_display|raw}</textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.json-field { min-height: 88px; font-size: 12px; line-height: 1.5; }
</style>
