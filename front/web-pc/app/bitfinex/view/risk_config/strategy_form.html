<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">分组</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.group_name|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">参数键</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.item_key|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">说明</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.description_text|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">值类型</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.value_type|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">参数值</label>
            <div class="layui-input-block">
                <input name="item_value" value="{$vo.item_value|default=''}" required placeholder="请输入参数值" class="layui-input mono">
                {if isset($vo.show_value_hint) && $vo.show_value_hint eq 1}
                <div class="layui-form-mid layui-word-aux">{$vo.value_hint|default=''}</div>
                {/if}
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <input type="hidden" name="scope" value="strategy">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
