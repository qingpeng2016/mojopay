<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">任务名</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.task_name|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">说明</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.description|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">执行间隔(小时)</label>
            <div class="layui-input-block">
                <input name="interval_hours" value="{$vo.interval_hours_display|default=''}" required
                       placeholder="如 6 表示 6 小时" class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">当前库存储：{$vo.interval_seconds|default='0'} 秒；保存时自动换算为秒</div>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
