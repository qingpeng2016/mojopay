<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">产品编码</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.product_code|default='-'}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">Symbol</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.symbol|default='-'}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">目标期限</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.target_period_days|default='-'}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">avg_rate</label>
            <div class="layui-input-block" style="padding-top:9px;">
                <span class="mono" style="color:#666;word-break:break-all;">{$vo.avg_rate_fmt|default='-'}</span>
                <div class="layui-form-mid layui-word-aux">只读展示，各数值保留 7 位小数</div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">period_days</label>
            <div class="layui-input-block">
                <input name="period_days" value="{$vo.period_days_edit|default='[]'}" required
                       placeholder='如 [2,7,14]' class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">lookback_hours</label>
            <div class="layui-input-block">
                <input name="lookback_hours" value="{$vo.lookback_hours_edit|default='[]'}" required
                       placeholder='如 [2,4,6]' class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">top_n</label>
            <div class="layui-input-block">
                <input name="top_n" value="{$vo.top_n_edit|default='[]'}" required
                       placeholder='如 [50,50,50]' class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">须与 lookback_hours 等长的正整数 JSON 数组</div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">floor</label>
            <div class="layui-input-block">
                <input name="placement_rate_floor" value="{$vo.placement_rate_floor_display|default='0'}" required
                       placeholder="如 0.0003001" class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">
                    当前：{$vo.placement_rate_floor_fmt|default='0'}；约合年化 {$vo.annual_rate_fmt|default='-'}（日利率 × 365）
                </div>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
