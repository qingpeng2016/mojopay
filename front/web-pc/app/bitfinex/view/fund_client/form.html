<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        {if isset($vo.id)}
        <div class="layui-form-item">
            <label class="layui-form-label">客户 ID</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.id|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        {/if}
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">客户名称</label>
            <div class="layui-input-block">
                <input name="name" value="{$vo.name|default=''}" required maxlength="128" placeholder="公司名/客户名" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input name="email" value="{$vo.email|default=''}" maxlength="128" placeholder="可选" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">电话</label>
            <div class="layui-input-block">
                <input name="phone" value="{$vo.phone|default=''}" maxlength="32" placeholder="可选" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户类型</label>
            <div class="layui-input-block">
                <select name="client_type">
                    {foreach $client_types as $ck=>$cl}
                    <option value="{$ck}" {if isset($vo.client_type) && $vo.client_type==$ck}selected{/if}>{$cl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">KYC 状态</label>
            <div class="layui-input-block">
                <select name="kyc_status">
                    {foreach $kyc_statuses as $kk=>$kl}
                    <option value="{$kk}" {if isset($vo.kyc_status) && $vo.kyc_status==$kk}selected{/if}>{$kl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">国家/地区</label>
            <div class="layui-input-block">
                <input name="country" value="{$vo.country|default=''}" maxlength="64" placeholder="如 CN" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">外部引用</label>
            <div class="layui-input-block">
                <input name="external_ref" value="{$vo.external_ref|default=''}" maxlength="128" placeholder="上游系统/Bitfinex 别名" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    {foreach $statuses as $sk=>$sl}
                    <option value="{$sk}" {if isset($vo.status) && $vo.status==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" maxlength="500" placeholder="可选" class="layui-textarea">{$vo.remark|default=''}</textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        {if isset($vo.id)}
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        {/if}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>
