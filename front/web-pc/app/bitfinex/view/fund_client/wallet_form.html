<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">客户</label>
            <div class="layui-input-block">
                <input type="text" value="#{$vo.id|default=''} {$vo.name|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">币种</label>
            <div class="layui-input-block">
                <select name="currency" lay-filter="fc-wallet-currency">
                    {foreach $currencies as $cur}
                    <option value="{$cur}">{$cur}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">当前可用</label>
            <div class="layui-input-block">
                <div class="fc-wallet-balance mono" data-currency="USD" style="padding-top:9px;">{$vo.wallet_balances.USD|default='0'}</div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">{$action_label|default=''}金额</label>
            <div class="layui-input-block">
                <input name="amount" required placeholder="大于 0" class="layui-input mono">
            </div>
        </div>
        {if isset($action) && $action eq 'withdraw'}
        <div class="layui-form-item">
            <label class="layui-form-label">手续费</label>
            <div class="layui-input-block">
                <input name="commission" value="0" placeholder="默认 0" class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">出金时从可用余额一并扣减</div>
            </div>
        </div>
        {/if}
        <div class="layui-form-item">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" maxlength="500" placeholder="可选" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="client_id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">确认{$action_label|default=''}</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    var form = layui.form;
    form.render();
    form.on('select(fc-wallet-currency)', function (data) {
        $('.fc-wallet-balance').hide();
        $('.fc-wallet-balance[data-currency="' + data.value + '"]').show();
    });
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
