<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">计提日</label>
            <div class="layui-input-inline" style="width:220px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="yyyy-MM-dd - yyyy-MM-dd" class="layui-input" id="sad-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">记录 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="id" value="{$get.id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">申购 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="subscription_id" value="{$get.subscription_id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">客户 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="client_id" value="{$get.client_id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="product_id" value="{$get.product_id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品编码</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="product_code" value="{$get.product_code|default=''}" placeholder="模糊" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline" style="width:90px;">
                <select name="status">
                    <option value="">全部</option>
                    {foreach $statuses as $st}
                    <option value="{$st}" {if isset($get.status) && $get.status==$st}selected{/if}>{$st}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
            <button type="button" class="layui-btn layui-btn-danger"
                    data-action='{:url("remove")}'
                    data-rule="id#{key}"
                    data-target="input.list-check-box.sad-row"
                    data-confirm="确定批量删除选中的计提记录吗？">批量删除</button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({ elem: '#sad-date-range', range: true, type: 'date' });
});
</script>
