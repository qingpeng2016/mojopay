<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off" id="fsr-subscribe-form">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">客户</label>
            <div class="layui-input-block">
                <select name="client_id" lay-search lay-filter="fsr-sub-client">
                    <option value="">请选择客户</option>
                    {foreach $clients as $client}
                    <option value="{$client.id}">#{$client.id} {$client.name|default=''}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">产品</label>
            <div class="layui-input-block">
                <select name="product_code" lay-search lay-filter="fsr-sub-product">
                    <option value="">请选择产品</option>
                    {foreach $products as $product}
                    <option value="{$product.product_code}">{$product.product_code} · {$product.product_name|default=''} ({$product.product_type|default=''})</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">申购金额</label>
            <div class="layui-input-block">
                <input name="amount" required placeholder="如 10000" class="layui-input mono" id="fsr-sub-amount">
            </div>
        </div>

        <div class="layui-form-item" id="fsr-subscribe-preview-wrap" style="display:none;">
            <label class="layui-form-label">系统显示</label>
            <div class="layui-input-block">
                <div class="fsr-subscribe-preview">
                    <div class="fsr-preview-floating" style="display:none;">
                        <div>当前净值(浮动型): <span class="mono" id="fsr-preview-nav">-</span></div>
                        <div>预计份额(浮动型): <span class="mono" id="fsr-preview-shares">-</span> <span class="fsr-preview-hint">（仅预估，T+1 后确认）</span></div>
                    </div>
                    <div class="fsr-preview-guaranteed" style="display:none;">
                        <div>保底年化(保底型): <span class="mono" id="fsr-preview-rate">-</span></div>
                    </div>
                    <div>生效日: <span class="mono" id="fsr-preview-effective">-</span> <span class="fsr-preview-hint">(T+1)</span></div>
                    <div>到期日: <span class="mono" id="fsr-preview-maturity">-</span></div>
                </div>
            </div>
        </div>

        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">提交申购</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
(function () {
    var FSR_PRODUCTS = {$products_map_json|raw};
    var FSR_CLIENT_RATES = {$client_rates_json|raw};

    function trimDecimal(num, scale) {
        var s = Number(num).toFixed(scale);
        s = s.replace(/\.?0+$/, '');
        return s === '' ? '0' : s;
    }

    function fmtYmd(d) {
        var y = d.getFullYear();
        var m = ('0' + (d.getMonth() + 1)).slice(-2);
        var day = ('0' + d.getDate()).slice(-2);
        return y + '.' + m + '.' + day;
    }

    function addDays(base, days) {
        var d = new Date(base.getFullYear(), base.getMonth(), base.getDate());
        d.setDate(d.getDate() + days);
        return d;
    }

    function getVal(name) {
        var el = document.querySelector('#fsr-subscribe-form [name="' + name + '"]');
        return el ? $.trim(el.value) : '';
    }

    function refreshPreview() {
        var clientId = parseInt(getVal('client_id'), 10) || 0;
        var productCode = getVal('product_code');
        var amountRaw = getVal('amount');
        var $wrap = $('#fsr-subscribe-preview-wrap');

        if (!productCode || !FSR_PRODUCTS[productCode]) {
            $wrap.hide();
            return;
        }

        var product = FSR_PRODUCTS[productCode];
        var termDays = parseInt(product.term_days, 10) || 0;
        var tomorrow = addDays(new Date(), 1);
        var maturity = termDays > 0 ? addDays(tomorrow, termDays) : null;

        $wrap.show();
        $('.fsr-preview-floating').toggle(product.product_type === 'FLOATING');
        $('.fsr-preview-guaranteed').toggle(product.product_type === 'GUARANTEED');

        if (product.product_type === 'FLOATING') {
            var nav = parseFloat(product.nav_per_share) || 0;
            $('#fsr-preview-nav').text(nav > 0 ? trimDecimal(nav, 6) : '-');
            var shares = '-';
            if (amountRaw !== '' && !isNaN(amountRaw) && parseFloat(amountRaw) > 0 && nav > 0) {
                shares = trimDecimal(parseFloat(amountRaw) / nav, 10);
            }
            $('#fsr-preview-shares').text(shares);
        } else {
            var rate = null;
            if (clientId > 0 && FSR_CLIENT_RATES[clientId] && FSR_CLIENT_RATES[clientId][productCode] !== undefined) {
                rate = FSR_CLIENT_RATES[clientId][productCode];
            } else if (product.guaranteed_rate !== undefined) {
                rate = product.guaranteed_rate;
            }
            $('#fsr-preview-rate').text(rate !== null ? trimDecimal(rate * 100, 1) + '%' : '-');
        }

        $('#fsr-preview-effective').text(fmtYmd(tomorrow));
        $('#fsr-preview-maturity').text(
            maturity ? fmtYmd(maturity) : (termDays === 0 ? '活期无固定到期日' : '-')
        );
    }

    layui.use(['form'], function () {
        var form = layui.form;
        form.render();
        form.on('select(fsr-sub-client)', refreshPreview);
        form.on('select(fsr-sub-product)', refreshPreview);
        $('#fsr-sub-amount').on('input change', refreshPreview);
        refreshPreview();
    });
})();
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
.fsr-subscribe-preview {
    padding: 10px 12px;
    background: #f8fafc;
    border: 1px solid #e6eef5;
    border-radius: 4px;
    font-size: 13px;
    line-height: 1.8;
    color: #333;
}
.fsr-preview-hint { color: #999; font-size: 12px; }
</style>
