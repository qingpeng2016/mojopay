<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">申购 ID</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.id|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">客户 / 产品</label>
            <div class="layui-input-block">
                <input type="text" value="#{$vo.client_id|default=''} {$vo.client_name|default=''} · {$vo.product_code|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block" style="padding-top:9px;">
                {$vo.status|default='-'}
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">申购日期</label>
            <div class="layui-input-block">
                <input name="subscribe_date" value="{$vo.subscribe_date_edit|default=''}" required
                       placeholder="YYYY-MM-DD" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">计息开始日</label>
            <div class="layui-input-block">
                <input name="start_interest_date" value="{$vo.start_interest_date_edit|default=''}" required
                       placeholder="YYYY-MM-DD（含）" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">计息结束日</label>
            <div class="layui-input-block">
                <input name="end_interest_date" value="{$vo.end_interest_date_edit|default=''}"
                       placeholder="YYYY-MM-DD；活期可留空" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">可赎回日</label>
            <div class="layui-input-block">
                <input name="remaining_date" value="{$vo.remaining_date_edit|default=''}"
                       placeholder="= end_interest_date+1；活期可留空" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">复利续存日起息</label>
            <div class="layui-input-block">
                <input name="compound_date" value="{$vo.compound_date_edit|default=''}"
                       placeholder="无复利可留空" class="layui-input">
            </div>
        </div>
        <div class="layui-form-mid layui-word-aux" style="padding-left:110px;margin-bottom:12px;">
            仅修改日期字段，不自动重算利息/可赎金额；请与策略计息规则一致后再保存。
            {if !empty($vo.is_flexible_term)}<br>当前为活期（term_days=0），结束日/可赎日/复利日通常为空。{/if}
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>
