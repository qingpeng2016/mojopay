<style>
/* 分页样式（与 cool_pay/market_mapping_config 一致，修复 SPA 内 ul 默认纵向排列） */
.layui-card-body .pagination,
.think-box-shadow .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin: 20px 0;
    padding: 0;
    list-style: none;
}

.layui-card-body .pagination li,
.think-box-shadow .pagination li {
    display: inline-block;
    margin: 0 2px;
    position: relative;
}

.layui-card-body .pagination li a,
.layui-card-body .pagination li span,
.think-box-shadow .pagination li a,
.think-box-shadow .pagination li span {
    display: inline-block;
    padding: 6px 10px;
    border: 1px solid #ddd;
    background: #fff;
    color: #666;
    text-decoration: none;
    border-radius: 2px;
    cursor: pointer;
    min-width: 36px;
    text-align: center;
    box-sizing: border-box;
    transition: all 0.3s ease;
    line-height: 1.2;
}

.layui-card-body .pagination li.active span,
.think-box-shadow .pagination li.active span {
    background: #009688 !important;
    color: #fff !important;
    border-color: #009688 !important;
    cursor: default;
}

.layui-card-body .pagination li a:hover,
.think-box-shadow .pagination li a:hover {
    background: #f2f2f2;
    border-color: #009688;
    color: #009688;
}

.layui-card-body .pagination li.disabled span,
.think-box-shadow .pagination li.disabled span {
    background: #f5f5f5;
    color: #999;
    cursor: not-allowed;
    border-color: #ddd;
}

.layui-card-body .pagination li a,
.think-box-shadow .pagination li a {
    position: relative;
    z-index: 1;
}

.layui-card-body .pagination li.active,
.think-box-shadow .pagination li.active {
    position: relative;
}

.layui-card-body .pagination li.active::before,
.think-box-shadow .pagination li.active::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: #009688;
    border-radius: 4px;
    z-index: -1;
}
</style>
<script>
$(document).ready(function () {
    $('.think-box-shadow .pagination li a').on('click', function (e) {
        e.preventDefault();
        var href = $(this).attr('href');
        if (href && href !== '#') {
            window.location.href = href;
        }
    });
});
</script>
