<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-inline" style="width:100px;">
                <input name="id" value="{$get.id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">交易所</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="vendor">
                    <option value="">全部</option>
                    {foreach $vendors as $vk=>$vl}
                    <option value="{$vk}" {if isset($get.vendor) && $get.vendor==$vk}selected{/if}>{$vl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">账户类型</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="account_type">
                    <option value="">全部</option>
                    {foreach $account_types as $ak=>$al}
                    <option value="{$ak}" {if isset($get.account_type) && $get.account_type==$ak}selected{/if}>{$al}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="status">
                    <option value="">全部</option>
                    {foreach $statuses as $sk=>$sl}
                    <option value="{$sk}" {if isset($get.status) && $get.status==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">关键词</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="keyword" value="{$get.keyword|default=''}" placeholder="展示名 / external_ref 模糊" class="layui-input">
            </div>
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
