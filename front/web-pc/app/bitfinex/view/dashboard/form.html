<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">展示名</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.account_name|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">别名</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.external_ref|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">借贷钱包金额</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.funding_balance_fmt|default='0.00000000'}" class="layui-input layui-disabled mono" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">可借贷金额</label>
            <div class="layui-input-block">
                <input name="funding_available_balance" value="{$vo.funding_available_balance_fmt|default=''}" required
                       placeholder="不能超过借贷钱包金额" class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">上限：{$vo.funding_balance_fmt|default='0.00000000'}</div>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render();
});
</script>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
