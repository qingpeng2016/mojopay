<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">客户 ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="client_id" value="{$get.client_id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品</label>
            <div class="layui-input-inline" style="width:220px;">
                <select name="product_id" lay-search>
                    <option value="">全部</option>
                    {foreach $products as $product}
                    <option value="{$product.id}" {if isset($get.product_id) && $get.product_id==$product.id}selected{/if}>
                        {$product.product_code} · {$product.product_name|default=''}
                    </option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">产品编码</label>
            <div class="layui-input-inline" style="width:180px;">
                <input name="product_code" value="{$get.product_code|default=''}" placeholder="模糊" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
