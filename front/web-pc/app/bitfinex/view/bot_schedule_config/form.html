<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        <div class="layui-form-item">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-block">
                <input type="text" value="{$vo.id|default=''}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">Module</label>
            <div class="layui-input-block">
                <input name="module" required maxlength="50" value="{:htmlentities((string)($vo['module']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">Task name</label>
            <div class="layui-input-block">
                <input name="task_name" required maxlength="100" value="{:htmlentities((string)($vo['task_name']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">执行间隔</label>
            <div class="layui-input-block">
                <input type="number" name="interval_seconds" min="0.001" step="any" required value="{$vo.interval_seconds|default=''}" class="layui-input mono">
                <div class="layui-form-mid layui-word-aux">秒</div>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">执行排序</label>
            <div class="layui-input-block">
                <input type="number" name="exe_sort" step="1" value="{$vo.exe_sort|default=''}" placeholder="留空表示未指定" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">并发数</label>
            <div class="layui-input-block">
                <input type="number" name="concurrency" min="1" step="1" value="{$vo.concurrency|default=''}" placeholder="留空表示不限制" class="layui-input mono">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">任务描述</label>
            <div class="layui-input-block">
                <input name="description" maxlength="500" value="{:htmlentities((string)($vo['description']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">任务开关</label>
            <div class="layui-input-block">
                <select name="is_enabled">
                    <option value="1" {if ($vo.is_enabled??1)==1}selected{/if}>启用</option>
                    <option value="0" {if isset($vo.is_enabled) && $vo.is_enabled==0}selected{/if}>禁用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">策略开关</label>
            <div class="layui-input-block">
                <select name="is_strategy_enabled">
                    <option value="1" {if ($vo.is_strategy_enabled??1)==1}selected{/if}>启用</option>
                    <option value="0" {if isset($vo.is_strategy_enabled) && $vo.is_strategy_enabled==0}selected{/if}>禁用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">仅主实例</label>
            <div class="layui-input-block" style="padding-top:9px;">
                {if $vo.is_primary_machine_run == 1}是{else}否{/if}
                <span class="layui-word-aux">（只读，由运行时维护）</span>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">最近活跃</label>
            <div class="layui-input-block">
                <input type="text" value="{:htmlentities((string)($vo['last_live_time']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input layui-disabled" disabled>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        <input type="hidden" name="id" value="{$vo.id|default=''}">
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>

<style>
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
</style>
<script>
layui.use('form', function () {
    layui.form.render('select');
});
</script>
