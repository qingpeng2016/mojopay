<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">Module</label>
            <div class="layui-input-inline" style="width:140px;">
                <input name="module" value="{$get.module|default='bitfinex'}" placeholder="默认 bitfinex" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">任务名</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="task_name" value="{$get.task_name|default=''}" placeholder="模糊" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">任务开关</label>
            <div class="layui-input-inline" style="width:100px;">
                <select name="is_enabled">
                    <option value="">全部</option>
                    <option value="1" {if ($get.is_enabled??'')==='1'}selected{/if}>启用</option>
                    <option value="0" {if ($get.is_enabled??'')==='0'}selected{/if}>禁用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
