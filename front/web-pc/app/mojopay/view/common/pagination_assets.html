<style>
.table-block .layui-table th:last-child,
.table-block .layui-table td:last-child {
    white-space: nowrap;
    width: 1%;
}
.table-block .layui-table td:last-child .layui-btn + .layui-btn {
    margin-left: 6px;
}
.layui-card-body .pagination,
.think-box-shadow .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    margin: 20px 0;
    padding: 0;
    list-style: none;
}
.layui-card-body .pagination li,
.think-box-shadow .pagination li {
    display: inline-block;
    margin: 0 2px;
}
.layui-card-body .pagination li a,
.layui-card-body .pagination li span,
.think-box-shadow .pagination li a,
.think-box-shadow .pagination li span {
    display: inline-block;
    padding: 6px 10px;
    border: 1px solid #ddd;
    background: #fff;
    color: #666;
    text-decoration: none;
    border-radius: 2px;
    min-width: 36px;
    text-align: center;
}
.layui-card-body .pagination li.active span,
.think-box-shadow .pagination li.active span {
    background: #009688 !important;
    color: #fff !important;
    border-color: #009688 !important;
}
</style>
<script>
$(document).ready(function () {
    $('.think-box-shadow .pagination li a').on('click', function (e) {
        e.preventDefault();
        var href = $(this).attr('href');
        if (!href || href === '#') {
            return;
        }
        if (window.self !== window.top && href.indexOf('admin.html#') !== -1) {
            var qs = href.split('?')[1] || '';
            var page = (href.match(/[?&]page=(\d+)/) || [])[1];
            var params = new URLSearchParams(window.location.search);
            if (page) {
                params.set('page', page);
            }
            if (qs) {
                qs.split('&').forEach(function (pair) {
                    var kv = pair.split('=');
                    if (kv[0] && kv[0] !== 'page') {
                        params.set(kv[0], decodeURIComponent(kv[1] || ''));
                    }
                });
            }
            window.location.search = '?' + params.toString();
            return;
        }
        window.location.href = href;
    });
});
</script>
