<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">创建时间</label>
            <div class="layui-input-inline" style="width:220px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="默认近 30 天" class="layui-input" id="scarb-orders-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-inline" style="width:90px;">
                <input name="id" value="{$get.id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">账号ID</label>
            <div class="layui-input-inline" style="width:100px;">
                <input name="exchange_account_id" value="{$get.exchange_account_id|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台</label>
            <div class="layui-input-inline" style="width:110px;">
                <select name="platform">
                    <option value="">全部</option>
                    {foreach $platforms as $pk=>$pl}
                    <option value="{$pk}" {if isset($get.platform) && $get.platform==$pk}selected{/if}>{$pl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">交易对</label>
            <div class="layui-input-inline" style="width:120px;">
                <input name="symbol" value="{$get.symbol|default=''}" placeholder="如 BTCUSDT" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">方向</label>
            <div class="layui-input-inline" style="width:90px;">
                <select name="side">
                    <option value="">全部</option>
                    {foreach $sides as $sk=>$sl}
                    <option value="{$sk}" {if isset($get.side) && $get.side==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline" style="width:130px;">
                <select name="status">
                    <option value="">全部</option>
                    {foreach $statuses as $sk=>$sl}
                    <option value="{$sk}" {if isset($get.status) && $get.status==$sk}selected{/if}>{$sl}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">Client OID</label>
            <div class="layui-input-inline" style="width:140px;">
                <input name="client_order_id" value="{$get.client_order_id|default=''}" placeholder="模糊" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">Purpose</label>
            <div class="layui-input-inline" style="width:130px;">
                <input name="purpose" value="{$get.purpose|default=''}" placeholder="精确" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({ elem: '#scarb-orders-date-range', type: 'date', range: ' - ', format: 'yyyy-MM-dd' });
});
</script>
