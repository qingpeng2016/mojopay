<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body" style="max-height:70vh;overflow-y:auto;">
        {if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
        <div class="layui-form-item"><label class="layui-form-label label-required-next">分组</label>
        <div class="layui-input-block"><input name="group_name" value="{$vo.group_name|default=''}" required class="layui-input mono" maxlength="64">
        <div class="layui-word-aux">group_name，如 funding / account_inspect</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">Key</label>
        <div class="layui-input-block"><input name="item_key" value="{$vo.item_key|default=''}" required class="layui-input mono" maxlength="128">
        <div class="layui-word-aux">item_key，与 Go 读取键一致</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">Value</label>
        <div class="layui-input-block"><textarea name="item_value" required class="layui-textarea mono" placeholder="配置值">{$vo.item_value|default=''}</textarea>
        <div class="layui-word-aux">百分比类请存小数，如 0.01=1%</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">类型</label>
        <div class="layui-input-block"><input name="value_type" value="{$vo.value_type|default='string'}" class="layui-input" maxlength="32" placeholder="string / int / decimal">
        <div class="layui-word-aux">value_type 仅作标注，不做强校验</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">排序</label>
        <div class="layui-input-block"><input name="sort_no" value="{$vo.sort_no|default='0'}" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label>
        <div class="layui-input-block"><input name="description" value="{$vo.description|default=''}" class="layui-input" maxlength="500"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">启用</label>
        <div class="layui-input-block">
            <input type="radio" name="is_enabled" value="1" title="启用" {if !isset($vo.is_enabled) || $vo.is_enabled==1}checked{/if}>
            <input type="radio" name="is_enabled" value="0" title="停用" {if isset($vo.is_enabled) && $vo.is_enabled==0}checked{/if}>
        </div></div>
        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>
