<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        {if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
        <div class="layui-form-item"><label class="layui-form-label label-required-next">账户</label>
        <div class="layui-input-block"><select name="exchange_account_id" required lay-search="">
            <option value="">请选择</option>
            {foreach $accounts as $aid=>$alabel}
            <option value="{$aid}" {if isset($vo.exchange_account_id) && $vo.exchange_account_id==$aid}selected{/if}>{$alabel}</option>
            {/foreach}
        </select></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">From</label>
        <div class="layui-input-block"><input name="from_asset" value="{$vo.from_asset|default='USDT'}" required class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">To</label>
        <div class="layui-input-block"><input name="to_asset" value="{$vo.to_asset|default='BFUSD'}" required class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">最小兑出</label>
        <div class="layui-input-block"><input name="min_from_qty" value="{$vo.min_from_qty|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">最大兑出</label>
        <div class="layui-input-block"><input name="max_from_qty" value="{$vo.max_from_qty|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">状态</label>
        <div class="layui-input-block">
            <select name="status">
                <option value="1" {if !isset($vo.status) || $vo.status==1}selected{/if}>启用</option>
                <option value="0" {if isset($vo.status) && $vo.status==0}selected{/if}>停用</option>
            </select>
        </div></div>
        <div class="layui-form-item"><label class="layui-form-label">extra_json</label>
        <div class="layui-input-block"><textarea name="extra_json" class="layui-textarea mono" placeholder="JSON">{$vo.extra_json|default=''}</textarea></div></div>
        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>
