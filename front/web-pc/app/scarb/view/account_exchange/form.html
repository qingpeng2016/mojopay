<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        {if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
        <div class="layui-form-item"><label class="layui-form-label label-required-next">平台</label>
        <div class="layui-input-block"><select name="platform" required>{foreach $platforms as $p}<option value="{$p}" {if isset($vo.platform) && $vo.platform==$p}selected{/if}>{$p}</option>{/foreach}</select></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">账户名</label>
        <div class="layui-input-block"><input name="account_name" value="{$vo.account_name|default=''}" required class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">账户类型</label>
        <div class="layui-input-block"><select name="account_type" required>{foreach $account_types as $t}<option value="{$t}" {if isset($vo.account_type) && $vo.account_type==$t}selected{/if}>{$t}</option>{/foreach}</select>
        <div class="layui-word-aux">币安 API Key/Secret 由服务端阿里云 KMS 拉取，不再入库</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">子账户邮箱</label>
        <div class="layui-input-block"><input name="sub_account_email" value="{$vo.sub_account_email|default=''}" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">状态</label>
        <div class="layui-input-block"><input type="radio" name="status" value="1" title="正常" {if !isset($vo.status) || $vo.status==1}checked{/if}>
        <input type="radio" name="status" value="0" title="停用" {if isset($vo.status) && $vo.status==0}checked{/if}></div></div>
        <div class="layui-form-item"><label class="layui-form-label">兑币任务</label>
        <div class="layui-input-block"><input type="radio" name="asset_convert_enabled" value="1" title="启用" {if isset($vo.asset_convert_enabled) && $vo.asset_convert_enabled==1}checked{/if}>
        <input type="radio" name="asset_convert_enabled" value="0" title="关闭" {if !isset($vo.asset_convert_enabled) || $vo.asset_convert_enabled==0}checked{/if}></div></div>
        <div class="layui-form-item"><label class="layui-form-label">双腿换仓</label>
        <div class="layui-input-block"><input type="radio" name="hedge_rebalance_enabled" value="1" title="启用" {if isset($vo.hedge_rebalance_enabled) && $vo.hedge_rebalance_enabled==1}checked{/if}>
        <input type="radio" name="hedge_rebalance_enabled" value="0" title="关闭" {if !isset($vo.hedge_rebalance_enabled) || $vo.hedge_rebalance_enabled==0}checked{/if}>
        <div class="layui-word-aux">触发换仓时为 USDT/USDC 两腿各写一条换仓审核</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">强制报价币</label>
        <div class="layui-input-block"><input name="force_use_quote" value="{$vo.force_use_quote|default=''}" placeholder="空=多USDT空USDC" class="layui-input mono">
        <div class="layui-word-aux">填写 USDC 或 USDT 后，开仓和换仓的新开腿，多空都用这个报价币。平仓仍平原持仓合约</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">最低 UniMMR</label>
        <div class="layui-input-block"><input name="min_portfolio_uni_mmr" value="{$vo.min_portfolio_uni_mmr|default='3'}" required class="layui-input mono">
        <div class="layui-word-aux">该账号统一账户 UniMMR 低于此值时，拒绝新开仓，也不扫描新建换仓审核</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">初始净资产</label>
        <div class="layui-input-block"><input name="origin_portfolio_total_asset_usdt" value="{$vo.origin_portfolio_total_asset_usdt|default=''}" class="layui-input mono" placeholder="空=未设置">
        <div class="layui-word-aux">origin_portfolio_total_asset_usdt：预计年化率分母；一般由 asset_sync 首次写入，可手工覆盖</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label>
        <div class="layui-input-block"><input name="remark" value="{$vo.remark|default=''}" class="layui-input"></div></div>
        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>
