<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body" style="max-height:70vh;overflow-y:auto;">
        {if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
        <div class="layui-form-item"><label class="layui-form-label label-required-next">模块</label>
        <div class="layui-input-block"><input name="module" value="{$vo.module|default='sc_arb'}" required class="layui-input" maxlength="50"></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">任务名</label>
        <div class="layui-input-block"><input name="task_name" value="{$vo.task_name|default=''}" required class="layui-input mono" maxlength="100">
        <div class="layui-word-aux">与 Go scheduler 注册名一致，如 strategy_order_entry</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">间隔(秒)</label>
        <div class="layui-input-block"><input name="interval_seconds" value="{$vo.interval_seconds|default='60'}" required class="layui-input mono">
        <div class="layui-word-aux">执行间隔秒数，支持小数</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">排序</label>
        <div class="layui-input-block"><input name="exe_sort" value="{$vo.exe_sort|default=''}" class="layui-input" placeholder="空=不参与流水线">
        <div class="layui-word-aux">exe_sort：仅 &gt;0 参与统一流水线；空或 0 不参与</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">并发</label>
        <div class="layui-input-block"><input name="concurrency" value="{$vo.concurrency|default=''}" class="layui-input" placeholder="空=不限制"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">说明</label>
        <div class="layui-input-block"><input name="description" value="{$vo.description|default=''}" class="layui-input" maxlength="500"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">启用</label>
        <div class="layui-input-block"><input type="radio" name="is_enabled" value="1" title="启用" {if !isset($vo.is_enabled) || $vo.is_enabled==1}checked{/if}>
        <input type="radio" name="is_enabled" value="0" title="禁用" {if isset($vo.is_enabled) && $vo.is_enabled==0}checked{/if}></div></div>
        <div class="layui-form-item"><label class="layui-form-label">策略开关</label>
        <div class="layui-input-block"><input type="radio" name="is_strategy_enabled" value="1" title="开" {if !isset($vo.is_strategy_enabled) || $vo.is_strategy_enabled==1}checked{/if}>
        <input type="radio" name="is_strategy_enabled" value="0" title="关" {if isset($vo.is_strategy_enabled) && $vo.is_strategy_enabled==0}checked{/if}>
        <div class="layui-word-aux">is_strategy_enabled：业务侧策略是否允许跑该任务</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label">主机器</label>
        <div class="layui-input-block"><input type="radio" name="is_primary_machine_run" value="1" title="是" {if isset($vo.is_primary_machine_run) && $vo.is_primary_machine_run==1}checked{/if}>
        <input type="radio" name="is_primary_machine_run" value="0" title="否" {if !isset($vo.is_primary_machine_run) || $vo.is_primary_machine_run==0}checked{/if}>
        <div class="layui-word-aux">是否仅主机器执行</div></div></div>
        {if isset($vo.id)}
        <div class="layui-form-item"><label class="layui-form-label">上次存活</label>
        <div class="layui-input-block"><input value="{$vo.last_live_time|default='-'}" class="layui-input" disabled></div></div>
        {/if}
        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>
