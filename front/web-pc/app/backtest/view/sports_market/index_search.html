<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"><div class="layui-form-item"><div class="layui-inline"><label class="layui-form-label">联赛 ID</label><div class="layui-input-inline"><input name="league_id" value="{$get.league_id|default=''}" class="layui-input"></div></div><div class="layui-inline"><label class="layui-form-label">赛事 ID</label><div class="layui-input-inline"><input name="event_id" value="{$get.event_id|default=''}" class="layui-input"></div></div><div class="layui-inline"><label class="layui-form-label">盘口标识</label><div class="layui-input-inline"><input name="market_key" value="{$get.market_key|default=''}" class="layui-input"></div></div><div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline"><select name="market_status"><option value="">全部</option>{foreach ['pending','close'] as $v}<option value="{$v}" {if ($get.market_status??'')==$v}selected{/if}>{$v}</option>{/foreach}</select></div></div><button class="layui-btn layui-btn-primary">搜索</button></div></form>
<p class="color-desc" style="margin:8px 0 12px;line-height:1.5">盘口键由玩法、比赛阶段、盘口线和选项按 # 拼接为四段：<code>&lt;玩法&gt;#&lt;比赛阶段&gt;#&lt;盘口线&gt;#&lt;选项&gt;</code></p>
