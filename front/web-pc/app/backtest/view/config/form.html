{extend name="../../admin/view/main"}{block name="button"}
<div class="layui-btn-group">
    <a href="/admin.html#/backtest/config/index.html" class="layui-btn layui-btn-sm layui-btn-primary">返回列表</a>
</div>
{/block}{block name="content"}
<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body padding-left-40">
        <input type="hidden" name="id" value="{$vo.id|default=''}">

        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">配置名称</label>
            <div class="layui-input-block">
                <input name="config_name" value="{$vo.config_name|default=''}" required maxlength="128" placeholder="如 ETHUSDT-15分钟盘" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">标的</label>
            <div class="layui-input-inline" style="width:200px;">
                <select name="symbol" class="layui-select" required>
                    {foreach $symbolOptions as $s => $label}
                    <option value="{$s}" {if (isset($vo.symbol) && $vo.symbol==$s) || (!isset($vo.symbol) && $s=='BTCUSDT')}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">时长档位(in_duration)</label>
            <div class="layui-input-inline" style="width:200px;">
                <select name="in_duration" class="layui-select">
                    {foreach $durations as $d}
                    <option value="{$d}" {if isset($vo.in_duration) && $vo.in_duration==$d}selected{/if}>{$d}</option>
                    {/foreach}
                </select>
            </div>
            <div class="layui-form-mid layui-word-aux">5m=300 15m=900 1h=3600 4h=14400 daily=86400（秒）</div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label" title="盘口总时长(秒)">盘口总时长(D)</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="in_d" value="{$vo.in_d|default='300'}" class="layui-input">
            </div>
            <label class="layui-form-label" title="初始净敞口(份)">净敞口(Q)</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="in_q" value="{$vo.in_q|default='0'}" class="layui-input">
            </div>
            <label class="layui-form-label" title="单边持仓限额(份)">单边持仓限额(Q_cap)</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="in_q_cap" value="{$vo.in_q_cap|default='0'}" class="layui-input" placeholder="单边持仓限额(份)">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label" title="回测要创建的盘口数">活跃盘口数</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="active_count" value="{$vo.active_count|default='5'}" class="layui-input">
            </div>
            <label class="layui-form-label" title="铺单计算间隔(毫秒)">计算间隔(ms)</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="calc_interval_ms" value="{$vo.calc_interval_ms|default='1000'}" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">定价源平台</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="pricing_source_platform" class="layui-select">
                    {foreach $sourcePlatforms as $p}
                    <option value="{$p}" {if isset($vo.pricing_source_platform) && $vo.pricing_source_platform==$p}selected{/if}>{$p}</option>
                    {/foreach}
                </select>
            </div>
            <label class="layui-form-label">定价源类型</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="pricing_source_type" class="layui-select">
                    {foreach $pricingSourceTypes as $t}
                    <option value="{$t}" {if isset($vo.pricing_source_type) && $vo.pricing_source_type==$t}selected{/if}>{$t}{if $t=='SPOT'}（现货）{elseif $t=='FUTURES'}（合约）{/if}</option>
                    {/foreach}
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">结算源平台</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="settlement_source_platform" class="layui-select">
                    {foreach $sourcePlatforms as $p}
                    <option value="{$p}" {if isset($vo.settlement_source_platform) && $vo.settlement_source_platform==$p}selected{/if}>{$p}</option>
                    {/foreach}
                </select>
            </div>
            <label class="layui-form-label">结算源类型</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="settlement_source_type" class="layui-select">
                    {foreach $sourceTypes as $t}
                    <option value="{$t}" {if isset($vo.settlement_source_type) && $vo.settlement_source_type==$t}selected{/if}>{$t}{if $t=='SPOT'}（现货）{elseif $t=='FUTURES'}（合约）{/if}</option>
                    {/foreach}
                </select>
            </div>
            <div class="layui-form-mid layui-word-aux">平台/类型按大写枚举保存；币安定价源和结算源均支持 SPOT（现货）及 FUTURES（合约）。</div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label label-required-next">回测模式</label>
            <div class="layui-input-inline" style="width:200px;">
                <select name="run_mode" class="layui-select">
                    <option value="live" {if !isset($vo.run_mode) || $vo.run_mode=='live'}selected{/if}>live（实时影子）</option>
                    <option value="history" {if isset($vo.run_mode) && $vo.run_mode=='history'}selected{/if}>history（历史区间）</option>
                </select>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <input type="radio" name="status" value="1" title="启用" {if !isset($vo.status) || $vo.status==1}checked{/if}>
                <input type="radio" name="status" value="0" title="停用" {if isset($vo.status) && $vo.status==0}checked{/if}>
            </div>
        </div>

        <div class="layui-form-item">
            <label class="layui-form-label">历史区间</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="history_start" value="{$vo.history_start|default=''}" placeholder="history 模式起始" class="layui-input">
            </div>
            <div class="layui-input-inline" style="width:200px;">
                <input name="history_end" value="{$vo.history_end|default=''}" placeholder="history 模式结束" class="layui-input">
            </div>
        </div>

        <div class="layui-form-item layui-form-text">
            <label class="layui-form-label">备注</label>
            <div class="layui-input-block">
                <textarea name="remark" placeholder="可选说明" class="layui-textarea">{$vo.remark|default=''}</textarea>
            </div>
        </div>
    </div>

    <div class="hr-line-dashed"></div>
    <div class="layui-form-item text-center">
        <button class="layui-btn" type="submit">保存</button>
        <a href="javascript:;" onclick="$.menu.href('#/backtest/config/index.html');return false;" class="layui-btn layui-btn-danger">取消</a>
    </div>
</form>
{/block}

{block name="script"}{/block}
