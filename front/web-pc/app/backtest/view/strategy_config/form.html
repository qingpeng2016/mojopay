{extend name="../../admin/view/main"}
{block name="button"}<a href="/admin.html#/backtest/strategy_config/index.html" class="layui-btn layui-btn-sm layui-btn-primary"><i class="layui-icon layui-icon-return"></i> 返回列表</a>{/block}
{block name="content"}
<form class="layui-form think-box-shadow schedule-form" action="{:request()->url()}" data-auto="true" method="post">
    <input type="hidden" name="id" value="{$vo.id|default=''}">
    <div class="layui-form-item"><label class="layui-form-label">策略族名</label><div class="layui-input-block">
        {if isset($vo.id)}<div class="layui-form-mid">{:htmlentities((string)$vo.strategy_name, ENT_QUOTES, 'UTF-8')}</div>{else}<input name="strategy_name" required maxlength="128" class="layui-input" placeholder="例如 quick_market">{/if}
    </div></div>
    <div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><input name="description" maxlength="512" value="{:htmlentities((string)($vo['description']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input"></div></div>
    <div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status"><option value="1" {if ($vo.status??1)==1}selected{/if}>启用</option><option value="2" {if ($vo.status??1)==2}selected{/if}>禁用</option><option value="3" {if ($vo.status??1)==3}selected{/if}>暂停</option><option value="4" {if ($vo.status??1)==4}selected{/if}>异常</option></select></div></div>
    <div class="layui-form-item"><div class="layui-input-block"><button type="submit" class="layui-btn"><i class="layui-icon layui-icon-ok"></i> 保存</button></div></div>
</form>
{/block}
{block name="script"}<style>.schedule-form{max-width:660px;padding:24px}.schedule-form .layui-input-block{max-width:440px}</style><script>layui.use('form',function(){layui.form.render('select');});</script>{/block}
