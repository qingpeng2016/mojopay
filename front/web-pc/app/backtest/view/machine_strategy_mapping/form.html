{extend name="../../admin/view/main"}
{block name="button"}<a href="/admin.html#/backtest/machine_strategy_mapping/index.html" class="layui-btn layui-btn-sm layui-btn-primary"><i class="layui-icon layui-icon-return"></i> 返回列表</a>{/block}
{block name="content"}
<form class="layui-form think-box-shadow mapping-form" action="{:request()->url()}" data-auto="true" method="post">
    <input type="hidden" name="id" value="{$vo.id|default=''}">
    <div class="layui-form-item"><label class="layui-form-label">实例标识</label><div class="layui-input-block"><input name="machine_name" required maxlength="128" value="{:htmlentities((string)($vo['machine_name']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input" placeholder="例如 fgmm-f-backtest-0"></div></div>
    <div class="layui-form-item"><label class="layui-form-label">策略族</label><div class="layui-input-block"><input name="strategy_ids" required maxlength="1024" value="{:htmlentities((string)($vo['strategy_ids']??''), ENT_QUOTES, 'UTF-8')}" class="layui-input" placeholder="quick_market|sports_market"></div></div>
    <div class="layui-form-item"><label class="layui-form-label">分配状态</label><div class="layui-input-block"><select name="status"><option value="1" {if ($vo.status??1)==1}selected{/if}>运行中</option><option value="2" {if ($vo.status??1)==2}selected{/if}>停止</option></select><div class="layui-form-mid layui-word-aux">停止后，本实例可能回退运行全部已启用策略。</div></div></div>
    <div class="layui-form-item"><div class="layui-input-block"><button type="submit" class="layui-btn"><i class="layui-icon layui-icon-ok"></i> 保存</button></div></div>
</form>
{/block}
{block name="script"}<style>.mapping-form{max-width:720px;padding:24px}.mapping-form .layui-input-block{max-width:500px}.mapping-form .layui-form-mid{float:none}</style><script>layui.use('form',function(){layui.form.render('select');});</script>{/block}
