<form class="layui-form layui-form-pane form-search sofile-search" action="/admin.html#/backtest/sofile/index.html" onsubmit="return false" method="get" autocomplete="off">
    <div class="sofile-search-row">
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">strategy</label>
            <div class="layui-input-inline sofile-search-input">
                <input name="strategy" value="{$get.strategy|default=''}" placeholder="如 fastbook" class="layui-input" autocomplete="new-password">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">capability</label>
            <div class="layui-input-inline sofile-search-input">
                <input name="capability" value="{$get.capability|default=''}" placeholder="如 placement / hedge" class="layui-input" autocomplete="new-password">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">profile</label>
            <div class="layui-input-inline sofile-search-input">
                <input name="profile" value="{$get.profile|default=''}" placeholder="如 default" class="layui-input" autocomplete="new-password">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">param_key</label>
            <div class="layui-input-inline sofile-search-input sofile-param-key">
                <input name="param_key" value="{$get.param_key|default=''}" placeholder="如 QCap" class="layui-input" autocomplete="new-password">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button type="button" class="layui-btn layui-btn-primary sofile-search-btn"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>
