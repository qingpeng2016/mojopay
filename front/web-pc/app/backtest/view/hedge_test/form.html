{extend name="../../admin/view/main"}
{block name="button"}<a href="/admin.html#/backtest/hedge_test/index.html" class="layui-btn layui-btn-sm layui-btn-primary">返回列表</a>{/block}
{block name="content"}
<form class="layui-form hedge-test-form" action="{:request()->url()}" data-auto="true" method="post">
    <input type="hidden" name="id" value="{$vo.id|default=''}">
    <section class="form-card">
        <h3>基本信息</h3>
        <div class="form-grid">
            <div><label>测试名称 <em>*</em></label><input type="text" name="name" value="{$vo.name|default=''}" class="layui-input" required placeholder="如：内部市场-001"></div>
            <div><label>备注</label><input type="text" name="remark" value="{$vo.remark|default=''}" class="layui-input" placeholder="可选"></div>
        </div>
    </section>
    <section class="form-card">
        <h3>SO 输入（JSON，所有字段可配置）</h3>
        <p class="help">整段 JSON 透传给 libsports-hedge.so；SO 字段更新后此处无需改结构。保存为 JSON 落库，详情页可再次编辑并「SO调用」。</p>
        <div class="layui-form-item">
            <textarea name="so_input" class="layui-textarea code-area" style="min-height:420px;" required>{$vo.so_input|default=''}</textarea>
        </div>
    </section>
    <div class="form-actions">
        <button class="layui-btn" type="submit">保存</button>
        <a href="/admin.html#/backtest/hedge_test/index.html" class="layui-btn layui-btn-primary">取消</a>
    </div>
</form>
{/block}
{block name="script"}<style>
.hedge-test-form{max-width:1080px;margin:0 auto}
.form-card{background:#fff;border:1px solid #edf0f5;border-radius:8px;padding:20px 24px;margin-bottom:16px;box-shadow:0 2px 10px rgba(31,45,61,.04)}
.form-card h3{margin:0 0 18px;font-size:17px;border-left:4px solid #16baaa;padding-left:10px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px}
.form-card label{display:block;color:#5f6672;margin-bottom:7px}
.form-card em{color:#ff5722}
.help{color:#8b93a1;margin:0 0 12px}
.code-area{font-family:Monaco,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;white-space:pre;overflow:auto}
.form-actions{text-align:center;padding:8px 0 24px}
@media(max-width:900px){.form-grid{grid-template-columns:1fr}}
</style>{/block}
