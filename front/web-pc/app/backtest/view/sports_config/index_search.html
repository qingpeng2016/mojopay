<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"><div class="layui-form-item">
<div class="layui-inline"><label class="layui-form-label">联赛 ID</label><div class="layui-input-inline"><input name="league_id" value="{$get.league_id|default=''}" class="layui-input"></div></div>
<div class="layui-inline"><label class="layui-form-label">联赛名称</label><div class="layui-input-inline"><input name="league_name" value="{$get.league_name|default=''}" class="layui-input"></div></div>
<div class="layui-inline"><label class="layui-form-label">赛事 ID</label><div class="layui-input-inline"><input name="event_id" value="{$get.event_id|default=''}" class="layui-input"></div></div><div class="layui-inline"><label class="layui-form-label">盘口标识</label><div class="layui-input-inline"><input name="market_key" value="{$get.market_key|default=''}" class="layui-input"></div></div>
<div class="layui-inline"><label class="layui-form-label">体育类型</label><div class="layui-input-inline" style="width:130px"><select name="sport_type"><option value="">全部</option>{foreach ['football','basketball'] as $v}<option value="{$v}" {if ($get.sport_type??'')==$v}selected{/if}>{$v}</option>{/foreach}</select></div></div>
<div class="layui-inline"><label class="layui-form-label">模式</label><div class="layui-input-inline" style="width:120px"><select name="run_mode"><option value="">全部</option><option value="live" {if ($get.run_mode??'')=='live'}selected{/if}>live</option><option value="history" {if ($get.run_mode??'')=='history'}selected{/if}>history</option></select></div></div>
<div class="layui-inline"><label class="layui-form-label">状态</label><div class="layui-input-inline" style="width:100px"><select name="status"><option value="">全部</option><option value="1" {if ($get.status??'')==='1'}selected{/if}>启用</option><option value="0" {if ($get.status??'')==='0'}selected{/if}>停用</option></select></div></div>
<button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜索</button></div></form>
