<div class="layui-card">
    <div class="layui-card-body" style="padding: 30px;">
        <div style="text-align: center; border: 2px dashed #e2e2e2; padding: 40px; border-radius: 10px;">
            <input type="file" id="csv_file_input" style="display:none;" accept=".csv">
            
            <i class="layui-icon" style="font-size: 60px; color: #009688;">&#xe67c;</i>
            <h3 style="margin-top: 15px;">CSV Bulk Import</h3>
            <p style="color: #999; margin-bottom: 20px;">Please select a standard formatted CSV file</p>

            <button type="button" class="layui-btn layui-btn-primary" onclick="$('#csv_file_input').click()">
                Select File
            </button>
            <div id="file_name" style="margin-top: 10px; font-weight: bold; color: #333;"></div>
            
            <hr style="margin: 30px 0;">
            
            <button type="button" class="layui-btn layui-btn-normal layui-btn-fluid" id="submit_upload_btn" onclick="executeUpload()">
                Start Processing
            </button>
        </div>
    </div>
</div>

<script>
// Filename listener
$('#csv_file_input').on('change', function() {
    if (this.files && this.files[0]) {
        $('#file_name').html('<span class="layui-badge layui-bg-blue">' + this.files[0].name + '</span>');
    }
});

function executeUpload() {
    var fileInput = $('#csv_file_input')[0];
    if (!fileInput.files || !fileInput.files[0]) {
        return $.msg.error('Please select a file');
    }

    var file = fileInput.files[0];
    var fd = new FormData();
    fd.append('csv_file', file);

    $.ajax({
        url: '{:url("upload")}',
        type: 'POST',
        data: fd,
        processData: false,
        contentType: false,
        beforeSend: function() { 
            $.msg.loading('Processing CSV...'); 
        },
        success: function(res) {
            $.msg.close();
            
            // AREA 1: Summary Title
            var resultHtml = '<div style="padding: 20px; font-family: monospace; line-height: 1.6;">';
            resultHtml += '<div style="margin-bottom: 15px; font-size: 15px; color: #333; font-weight: bold; border-left: 4px solid #009688; padding-left: 10px;">' + res.info + '</div>';

            // AREA 2: Success List
            resultHtml += '<div style="color: #5FB878; font-weight: bold; margin-bottom: 5px;">----------关联成功列表----------</div>';
            resultHtml += '<div style="max-height: 150px; overflow-y: auto; border: 1px solid #e2e2e2; padding: 10px; background: #fbfbfb; margin-bottom: 20px; font-size: 12px; white-space: pre-wrap;">';
            if (res.success_list && res.success_list.length > 0) {
                res.success_list.forEach(function(item) {
                    resultHtml += '<div style="border-bottom: 1px dashed #eee;">' + item + ', 关联成功</div>';
                });
            } else {
                resultHtml += '<div style="color: #999;">暂无成功记录</div>';
            }
            resultHtml += '</div>';

            // AREA 3: Failure List
            resultHtml += '<div style="color: #FF5722; font-weight: bold; margin-bottom: 5px;">----------关联失败列表----------</div>';
            resultHtml += '<div style="max-height: 200px; overflow-y: auto; border: 1px solid #e2e2e2; padding: 10px; background: #fff5f5; font-size: 12px; word-break: break-all;">';
            if (res.errors && res.errors.length > 0) {
                res.errors.forEach(function(err) {
                    resultHtml += '<div style="border-bottom: 1px dashed #ffdada; padding-bottom: 5px; margin-bottom: 5px;">' + err + '</div>';
                });
            } else {
                resultHtml += '<div style="color: #999;">暂无失败记录</div>';
            }
            resultHtml += '</div>';
            
            resultHtml += '</div>';

            layer.open({
                type: 1,
                title: '<i class="layui-icon">&#xe62a;</i> 导入结果',
                area: ['650px', '600px'], // Increased width/height for better readability
                content: resultHtml,
                btn: ['关闭并刷新页面'],
                closeBtn: 1,
                shadeClose: false,
                yes: function(index) {
                    layer.close(index);
                    location.reload(); 
                }
            });
        },
        error: function(xhr) {
            $.msg.close();
            layer.alert('服务器响应错误，请检查网络或后端日志', {icon: 2, title: 'Network Error'});
        }
    });
}
</script>
