<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">时间</label>
        <div class="layui-input-inline" style="width:220px;">
            <input name="date_range" value="{$q_date_range|default=''}" placeholder="请选择时间范围" class="layui-input" id="dr_date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">买卖方向</label>
        <div class="layui-input-inline">
            <select name="order_side" class="layui-select">
                <option value="">全部</option>
                {foreach $order_sides as $side}
                <option value="{$side}" {if isset($q_order_side) && $q_order_side==$side}selected{/if}>{$side}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">交易状态</label>
        <div class="layui-input-inline">
            <select name="status" class="layui-select">
                <option value="">全部</option>
                {foreach $statuses as $status}
                <option value="{$status}" {if isset($q_status) && $q_status==$status}selected{/if}>{$status}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">做市账户邮箱</label>
        <div class="layui-input-inline">
            <input name="target_account_email" value="{$q_target_account_email|default=''}" placeholder="做市账户邮箱" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">对冲账户邮箱</label>
        <div class="layui-input-inline">
            <input name="source_account_email" value="{$q_source_account_email|default=''}" placeholder="对冲账户邮箱" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">做市</label>
        <div class="layui-input-inline">
            <input name="target_group_id" value="{$q_target_group_id|default=''}" placeholder="market id" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">对冲订单id</label>
        <div class="layui-input-inline">
            <input name="source_order_id" value="{$q_source_order_id|default=''}" placeholder="对冲订单id" class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button type="submit" class="layui-btn layui-btn-primary" lay-submit lay-filter="dr-search">搜索</button>
    </div>
    <div class="layui-form-item layui-inline">
        <button type="button" id="dr-btn-reset" class="layui-btn layui-btn-primary">重置</button>
    </div>
    <div class="layui-form-item layui-inline">
        <button type="button" id="dr-btn-export" class="layui-btn layui-btn-normal" style="min-width:88px;color:#fff;">导出报表</button>
    </div>
</form>
