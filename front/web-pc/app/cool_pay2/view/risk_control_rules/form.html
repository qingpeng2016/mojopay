<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">规则类型</label>
            <div class="layui-input-block">
                <input name="rule_type" value='{$vo.rule_type|default=""}' required placeholder="请输入规则类型，如：成交、坐市平台、对冲平台等" class="layui-input" maxlength="50">
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">规则名称</label>
            <div class="layui-input-block">
                <input name="rule_name" value='{$vo.rule_name|default=""}' required placeholder="请输入规则名称" class="layui-input" maxlength="100">
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">指标描述</label>
            <div class="layui-input-block">
                <textarea name="rule_des" placeholder="请输入指标描述，如：持仓金额、成交频率等" class="layui-textarea" required maxlength="255">{$vo.rule_des|default=""}</textarea>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">操作符</label>
            <div class="layui-input-block">
                <select name="operator" class="layui-select" required>
                    <option value="">请选择操作符</option>
                    {foreach $operators as $key=>$item}
                    <option value="{$key}" {if isset($vo.operator) and $vo.operator eq $key}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">阈值</label>
            <div class="layui-input-block">
                <input name="threshold_value" value='{$vo.threshold_value|default="0"}' placeholder="请输入阈值，如：100000.00" class="layui-input" type="number" step="0.00000001" min="0">
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">时间窗口(秒)</label>
            <div class="layui-input-block">
                <input name="time_window" value='{$vo.time_window|default="0"}' placeholder="请输入时间窗口，如：3600" class="layui-input" type="number" min="0">
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">报警消息模板</label>
            <div class="layui-input-block">
                <textarea name="alert_message_template" placeholder="请输入报警消息模板，支持变量替换" class="layui-textarea" maxlength="500">{$vo.alert_message_template|default=""}</textarea>
            </div>
        </div>
        
        <div class="layui-form-item">
            <label class="layui-form-label">启用状态</label>
            <div class="layui-input-block">
                <input type="radio" name="enabled" value="1" title="启用" {if !isset($vo.enabled) or $vo.enabled eq 1}checked{/if}>
                <input type="radio" name="enabled" value="0" title="禁用" {if isset($vo.enabled) and $vo.enabled eq 0}checked{/if}>
            </div>
        </div>
        
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消编辑吗？" data-close>取消编辑</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
    
    // 表单提交监听
    form.on('submit(*)', function(data) {
        console.log('Form data:', data.field);
        
        // 验证阈值字段
        var thresholdValue = data.field.threshold_value;
        if (thresholdValue === '' || thresholdValue === null) {
            data.field.threshold_value = 0;
        }
        
        // 验证时间窗口字段
        var timeWindow = data.field.time_window;
        if (timeWindow === '' || timeWindow === null) {
            data.field.time_window = 0;
        }
        
        return true;
    });
});
</script>
