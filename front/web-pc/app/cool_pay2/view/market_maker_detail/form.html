<style>
.mm-robot-form-wrap { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 8px; max-width: 28rem; margin: 0 auto; }
.mm-robot-form-wrap .card { background: white; border: 1px solid #e5e5e5; border-radius: 0.625rem; }
.mm-robot-form-wrap .label { display: block; font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem; }
.mm-robot-form-wrap textarea {
    width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #e5e5e5; border-radius: 0.375rem;
    font-size: 0.875rem; box-sizing: border-box; resize: vertical;
}
.mm-robot-form-wrap .btn {
    display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;
    background: #000; color: white; border: none; border-radius: 0.375rem; cursor: pointer;
    font-size: 0.875rem; font-weight: 500;
}
.mm-robot-form-wrap .btn-secondary { background: #fff; color: #333; border: 1px solid #e5e5e5; }
</style>
<div class="mm-robot-form-wrap">
    <div class="card">
        <div class="p-6">
            <h3 style="font-size:1.125rem;font-weight:600;margin:0 0 1rem;">修改配置值</h3>
            <form class="layui-form" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
                <label class="label">当前值</label>
                <textarea name="value" required lay-verify="required" rows="5" placeholder="请输入">{$vo.value}</textarea>
                <input type="hidden" name="id" value="{$vo.id}">
                <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-top:1rem;">
                    <button class="btn" type="submit">保存配置</button>
                    <button class="btn btn-secondary" type="button" data-close>取消</button>
                </div>
            </form>
        </div>
    </div>
</div>
