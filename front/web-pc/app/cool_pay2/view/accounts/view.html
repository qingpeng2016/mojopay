<div class="layui-card">
    <div class="layui-card-header">详细信息</div>
    <div class="layui-card-body">
        {if !empty($vo.info_formatted)}
        <pre style="background-color: #f8f8f8; padding: 15px; border-radius: 4px; border: 1px solid #e0e0e0; max-height: 500px; overflow-y: auto; margin: 0;"><code>{$vo.info_formatted}</code></pre>
        {else}
        <div style="text-align: center; padding: 40px; color: #999;">
            <i class="layui-icon layui-icon-file" style="font-size: 48px;"></i>
            <p style="margin-top: 10px;">暂无详细信息</p>
        </div>
        {/if}
        
        <div style="text-align: center; margin-top: 20px;">
            <button class="layui-btn layui-btn-primary" type="button" data-close>关闭</button>
        </div>
    </div>
</div>

<style>
pre code {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 1.8;
    color: #333;
}
</style>
