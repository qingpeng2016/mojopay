<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">配置ID</label>
        <div class="layui-input-inline">
            <input name="id" value="{$get.id|default=''}" placeholder="请输入配置ID"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">配置类型</label>
        <div class="layui-input-inline">
            <select name="config_type" class="layui-select">
                <option value="">所有类型</option>
                {foreach $config_types as $key=>$item}
                <option value="{$key}" {if isset($get.config_type) && $get.config_type==$key}selected{/if}>{$item}
                </option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">配置名称</label>
        <div class="layui-input-inline">
            <input name="config_name" value="{$get.config_name|default=''}" placeholder="请输入配置名称"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">配置描述</label>
        <div class="layui-input-inline">
            <input name="description" value="{$get.description|default=''}" placeholder="请输入配置描述"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间</label>
        <div class="layui-input-inline">
            <input name="date_range" value="{$get.date_range|default=''}" placeholder="请选择日期范围"
                   class="layui-input" id="date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增配置</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form;
        var laydate = layui.laydate;

        // 初始化日期范围选择器
        laydate.render({
            elem: '#date_range',
            type: 'date',
            range: ' - ',
            format: 'yyyy-MM-dd'
        });
    });
</script>
