<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">

        <div class="layui-form-item">
            <label class="layui-form-label">配置类型</label>
            <div class="layui-input-block">
                <select name="config_type" class="layui-select" required>
                    <option value="">请选择配置类型</option>
                    {foreach $config_types as $key=>$item}
                    <option value="{$key}" {if isset($vo.config_type) and $vo.config_type eq $key}selected{elseif !isset($vo.config_type) and $key eq 'trading'}selected{/if}>{$item}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">配置名称</label>
            <div class="layui-input-block">
                <input name="config_name" value='{$vo.config_name|default=""}' required placeholder="请输入配置名称" class="layui-input" maxlength="100">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">配置描述</label>
            <div class="layui-input-block">
                <textarea name="description" placeholder="请输入配置描述" class="layui-textarea" maxlength="255">{$vo.description|default=""}</textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">配置值</label>
            <div class="layui-input-block">
                <textarea name="value" placeholder="请输入配置值" class="layui-textarea" required maxlength="500">{$vo.value|default=""}</textarea>
            </div>
        </div>
        <div class="hr-line-dashed"></div>
        {notempty name='vo.id'}<input type='hidden' value='{$vo.id}' name='id'>{/notempty}
        <div class="layui-form-item text-center">
            <button class="layui-btn" type='submit'>保存数据</button>
            <button class="layui-btn layui-btn-danger" type='button' data-confirm="确定要取消编辑吗？" data-close>取消编辑</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function(){
    var form = layui.form;
    
    // 表单提交监听
    form.on('submit(*)', function(data) {
        console.log('Form data:', data.field);
        return true;
    });
});
</script>
