<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-inline" style="width:100px;">
                <input name="id" value="{$get.id|default=''}" placeholder="主键精确" class="layui-input" type="number" min="1">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">账户ID</label>
            <div class="layui-input-inline" style="width:100px;">
                <input name="account_id" value="{$get.account_id|default=''}" placeholder="精确匹配" class="layui-input" type="number" min="1">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台</label>
            <div class="layui-input-inline" style="width:130px;">
                <select name="platform" class="layui-select">
                    <option value="">全部</option>
                    {foreach $platforms as $key=>$label}
                    <option value="{$key}" {if isset($get.platform) && $get.platform==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">可赎回</label>
            <div class="layui-input-inline" style="width:110px;">
                <select name="redeemable" class="layui-select">
                    <option value="">全部</option>
                    <option value="1" {if isset($get.redeemable) && $get.redeemable=='1'}selected{/if}>可赎回</option>
                    <option value="0" {if isset($get.redeemable) && $get.redeemable=='0'}selected{/if}>不可赎回</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">市场名称</label>
            <div class="layui-input-inline" style="width:180px;">
                <input name="market_name" value="{$get.market_name|default=''}" placeholder="模糊匹配问题/名称" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">市场ID</label>
            <div class="layui-input-inline" style="width:160px;">
                <input name="market_id" value="{$get.market_id|default=''}" placeholder="模糊匹配" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">结果方向</label>
            <div class="layui-input-inline" style="width:120px;">
                <input name="outcome" value="{$get.outcome|default=''}" placeholder="如 YES/NO" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">同步时间</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="开始日期 - 结束日期" class="layui-input" id="pos-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({
        elem: '#pos-date-range',
        type: 'date',
        range: ' - ',
        format: 'yyyy-MM-dd'
    });
});
</script>
