<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">模型名</label>
            <div class="layui-input-inline">
                <input name="name" value="{$get.name|default=''}" placeholder="模糊匹配模型名" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">启用状态</label>
            <div class="layui-input-inline" style="width:130px;">
                <select name="is_enabled" class="layui-select">
                    <option value="">全部</option>
                    <option value="1" {if isset($get.is_enabled) && $get.is_enabled=='1'}selected{/if}>启用</option>
                    <option value="0" {if isset($get.is_enabled) && $get.is_enabled=='0'}selected{/if}>停用</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
