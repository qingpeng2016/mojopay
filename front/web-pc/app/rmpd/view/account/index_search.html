<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">ID</label>
            <div class="layui-input-inline" style="width:100px;">
                <input name="id" value="{$get.id|default=''}" placeholder="主键精确" class="layui-input" type="number" min="1">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台</label>
            <div class="layui-input-inline" style="width:150px;">
                <select name="vendor" class="layui-select">
                    <option value="">全部</option>
                    {foreach $vendors as $v}
                    <option value="{$v}" {if isset($get.vendor) && $get.vendor==$v}selected{/if}>{$v}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">账户类型</label>
            <div class="layui-input-inline" style="width:140px;">
                <input name="account_type" value="{$get.account_type|default=''}" placeholder="模糊匹配" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台账户ID</label>
            <div class="layui-input-inline" style="width:180px;">
                <input name="market_account_id" value="{$get.market_account_id|default=''}" placeholder="模糊匹配" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-inline" style="width:120px;">
                <input name="status" value="{$get.status|default=''}" placeholder="如 Normal" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form'], function () {
    layui.form.render('select');
});
</script>
