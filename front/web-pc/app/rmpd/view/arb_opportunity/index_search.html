<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">市场对ID</label>
            <div class="layui-input-inline" style="width:110px;">
                <input name="market_pair_id" value="{$get.market_pair_id|default=''}" placeholder="精确匹配" class="layui-input" type="number" min="1">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">有无机会</label>
            <div class="layui-input-inline" style="width:110px;">
                <select name="has_opportunity" class="layui-select">
                    <option value="">全部</option>
                    <option value="1" {if isset($get.has_opportunity) && $get.has_opportunity=='1'}selected{/if}>有机会</option>
                    <option value="0" {if isset($get.has_opportunity) && $get.has_opportunity=='0'}selected{/if}>无机会</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">套利方向</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="buy_side" class="layui-select">
                    <option value="">全部</option>
                    {foreach $opp_sides as $key=>$label}
                    <option value="{$key}" {if isset($get.buy_side) && $get.buy_side==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台A</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="platform_a" class="layui-select">
                    <option value="">全部</option>
                    {foreach $platforms as $key=>$label}
                    <option value="{$key}" {if isset($get.platform_a) && $get.platform_a==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">平台B</label>
            <div class="layui-input-inline" style="width:120px;">
                <select name="platform_b" class="layui-select">
                    <option value="">全部</option>
                    {foreach $platforms as $key=>$label}
                    <option value="{$key}" {if isset($get.platform_b) && $get.platform_b==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">依赖类型</label>
            <div class="layui-input-inline" style="width:160px;">
                <select name="dependency_type" class="layui-select">
                    <option value="">全部</option>
                    {foreach $dep_types as $key=>$label}
                    <option value="{$key}" {if isset($get.dependency_type) && $get.dependency_type==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">快照时间</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="开始日期 - 结束日期" class="layui-input" id="opp-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({
        elem: '#opp-date-range',
        type: 'date',
        range: ' - ',
        format: 'yyyy-MM-dd'
    });
});
</script>
