<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get" autocomplete="off">
    <div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">套利记录ID</label>
            <div class="layui-input-inline" style="width:130px;">
                <input name="arb_record_id" value="{$get.arb_record_id|default=''}" placeholder="arb_record.id" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">成交腿</label>
            <div class="layui-input-inline" style="width:170px;">
                <select name="leg" class="layui-select">
                    <option value="">全部</option>
                    {foreach $legs as $key=>$label}
                    <option value="{$key}" {if isset($get.leg) && $get.leg==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">方向</label>
            <div class="layui-input-inline" style="width:130px;">
                <select name="side" class="layui-select">
                    <option value="">全部</option>
                    {foreach $sides as $key=>$label}
                    <option value="{$key}" {if isset($get.side) && $get.side==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">来源</label>
            <div class="layui-input-inline" style="width:170px;">
                <select name="data_source" class="layui-select">
                    <option value="">全部</option>
                    {foreach $data_sources as $key=>$label}
                    <option value="{$key}" {if isset($get.data_source) && $get.data_source==$key}selected{/if}>{$label}</option>
                    {/foreach}
                </select>
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <label class="layui-form-label">写入时间</label>
            <div class="layui-input-inline" style="width:200px;">
                <input name="date_range" value="{$get.date_range|default=''}" placeholder="默认近 30 天" class="layui-input" id="atr-date-range">
            </div>
        </div>
        <div class="layui-form-item layui-inline">
            <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        </div>
    </div>
</form>

<script>
layui.use(['form', 'laydate'], function () {
    layui.form.render('select');
    layui.laydate.render({
        elem: '#atr-date-range',
        type: 'date',
        range: ' - ',
        format: 'yyyy-MM-dd'
    });
});
</script>
