<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
<div class="layui-card-body">
{if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
<div class="layui-form-item"><label class="layui-form-label label-required-next">slug</label><div class="layui-input-block"><input name="slug" value="{$vo.slug|default=''}" required maxlength="50" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">显示名</label><div class="layui-input-block"><input name="display_name" value="{$vo.display_name|default=''}" maxlength="64" class="layui-input"></div></div>
<div class="layui-form-item"><label class="layui-form-label">类型</label><div class="layui-input-block"><select name="platform_type">{foreach $platform_types as $t}<option value="{$t}" {if isset($vo.platform_type)&&$vo.platform_type==$t}selected{/if}>{$t}</option>{/foreach}</select></div></div>
<div class="layui-form-item"><label class="layui-form-label">报价风格</label><div class="layui-input-block"><select name="quote_style">{foreach $quote_styles as $q}<option value="{$q}" {if isset($vo.quote_style)&&$vo.quote_style==$q}selected{/if}>{$q}</option>{/foreach}</select></div></div>
<div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><select name="status">{foreach $statuses as $s}<option value="{$s}" {if isset($vo.status)&&$vo.status==$s}selected{/if}>{$s}</option>{/foreach}</select></div></div>
<div class="layui-form-item"><label class="layui-form-label">超时秒</label><div class="layui-input-block"><input name="timeout" value="{$vo.timeout|default='30'}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">重试次数</label><div class="layui-input-block"><input name="retry_times" value="{$vo.retry_times|default='3'}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">重试间隔</label><div class="layui-input-block"><input name="retry_interval" value="{$vo.retry_interval|default='1'}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">排序</label><div class="layui-input-block"><input name="sort" value="{$vo.sort|default='0'}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">market_api</label><div class="layui-input-block"><input name="market_api_base_url" value="{$vo.market_api_base_url|default=''}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">order_api</label><div class="layui-input-block"><input name="order_api_base_url" value="{$vo.order_api_base_url|default=''}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">websocket</label><div class="layui-input-block"><input name="websocket_url" value="{$vo.websocket_url|default=''}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">user_ws</label><div class="layui-input-block"><input name="user_websocket_url" value="{$vo.user_websocket_url|default=''}" class="layui-input mono"></div></div>
<div class="layui-form-item"><label class="layui-form-label">extra JSON</label><div class="layui-input-block"><textarea name="extra_config" class="layui-textarea mono" rows="3">{$vo.extra_config|default=''}</textarea></div></div>
<div class="layui-form-item"><label class="layui-form-label">备注</label><div class="layui-input-block"><input name="remark" value="{$vo.remark|default=''}" class="layui-input"></div></div>
<div class="layui-form-item text-center"><button class="layui-btn" type="submit">保存</button><button type="button" class="layui-btn layui-btn-danger" data-close>取消</button></div>
</div>
</form>
