<form class="layui-form layui-card" action="{:request()->url()}" data-auto="true" method="post" autocomplete="off">
    <div class="layui-card-body">
        {if isset($vo.id)}<input type="hidden" name="id" value="{$vo.id}">{/if}
        <div class="layui-form-item"><label class="layui-form-label label-required-next">平台</label>
        <div class="layui-input-block"><select name="platform" required>{foreach $platforms as $p}<option value="{$p}" {if isset($vo.platform) && $vo.platform==$p}selected{/if}>{$p}</option>{/foreach}</select></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">别名</label>
        <div class="layui-input-block"><input name="name" value="{$vo.name|default=''}" required maxlength="64" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">认证模式</label>
        <div class="layui-input-block"><select name="auth_mode" required>{foreach $auth_modes as $m}<option value="{$m}" {if isset($vo.auth_mode) && $vo.auth_mode==$m}selected{/if}>{$m}</option>{/foreach}</select>
        <div class="layui-word-aux">KMS/CLOB 预测市场；BC 赔率平台账密</div></div></div>
        <div class="layui-form-item"><label class="layui-form-label label-required-next">状态</label>
        <div class="layui-input-block"><select name="status" required>{foreach $statuses as $s}<option value="{$s}" {if isset($vo.status) && $vo.status==$s}selected{/if}>{$s}</option>{/foreach}</select>
        <div class="layui-word-aux">策略仅加载 status=ACTIVE 的账户</div></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>API 凭据</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">api_key</label>
        <div class="layui-input-block"><input name="api_key" value="{$vo.api_key|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">api_secret_enc</label>
        <div class="layui-input-block"><input name="api_secret_enc" value="{$vo.api_secret_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{else}入库密文{/if}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">api_passphrase_enc</label>
        <div class="layui-input-block"><input name="api_passphrase_enc" value="{$vo.api_passphrase_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>Builder（Poly）</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">builder_api_key</label>
        <div class="layui-input-block"><input name="builder_api_key" value="{$vo.builder_api_key|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">builder_api_secret_enc</label>
        <div class="layui-input-block"><input name="builder_api_secret_enc" value="{$vo.builder_api_secret_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">builder_api_passphrase_enc</label>
        <div class="layui-input-block"><input name="builder_api_passphrase_enc" value="{$vo.builder_api_passphrase_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>Kalshi / KMS</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">key_id</label>
        <div class="layui-input-block"><input name="key_id" value="{$vo.key_id|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">kms_sign_address</label>
        <div class="layui-input-block"><input name="kms_sign_address" value="{$vo.kms_sign_address|default=''}" class="layui-input mono"></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>链上 / Magic</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">eoa_address</label>
        <div class="layui-input-block"><input name="eoa_address" value="{$vo.eoa_address|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">proxy_address</label>
        <div class="layui-input-block"><input name="proxy_address" value="{$vo.proxy_address|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">private_key_enc</label>
        <div class="layui-input-block"><input name="private_key_enc" value="{$vo.private_key_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">signature_type</label>
        <div class="layui-input-block"><input name="signature_type" value="{$vo.signature_type|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">Magic 账户</label>
        <div class="layui-input-block"><input type="radio" name="use_magic_account" value="1" title="是" {if isset($vo.use_magic_account) && $vo.use_magic_account==1}checked{/if}>
        <input type="radio" name="use_magic_account" value="0" title="否" {if !isset($vo.use_magic_account) || $vo.use_magic_account==0}checked{/if}></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>Foregate / BC</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">foregate_user_id</label>
        <div class="layui-input-block"><input name="foregate_user_id" value="{$vo.foregate_user_id|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">account_type</label>
        <div class="layui-input-block"><select name="account_type"><option value="">（空）</option>{foreach $foregate_types as $t}<option value="{$t}" {if isset($vo.account_type) && $vo.account_type==$t}selected{/if}>{$t}</option>{/foreach}</select></div></div>
        <div class="layui-form-item"><label class="layui-form-label">fg_token_enc</label>
        <div class="layui-input-block"><input name="fg_token_enc" value="{$vo.fg_token_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">login_name</label>
        <div class="layui-input-block"><input name="login_name" value="{$vo.login_name|default=''}" class="layui-input"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">login_password_enc</label>
        <div class="layui-input-block"><input name="login_password_enc" value="{$vo.login_password_enc_display|default=''}" placeholder="{if isset($vo.id)}留空表示不修改{/if}" class="layui-input mono"></div></div>

        <fieldset class="layui-elem-field layui-field-title"><legend>其它</legend></fieldset>
        <div class="layui-form-item"><label class="layui-form-label">挂单超时(分)</label>
        <div class="layui-input-block"><input name="order_max_pending_time" value="{$vo.order_max_pending_time|default=''}" class="layui-input mono"></div></div>
        <div class="layui-form-item"><label class="layui-form-label">config JSON</label>
        <div class="layui-input-block"><textarea name="config" class="layui-textarea mono" rows="3">{$vo.config|default=''}</textarea></div></div>
        <div class="layui-form-item"><label class="layui-form-label">备注</label>
        <div class="layui-input-block"><input name="remark" value="{$vo.remark|default=''}" maxlength="500" class="layui-input"></div></div>

        <div class="hr-line-dashed"></div>
        <div class="layui-form-item text-center">
            <button class="layui-btn" type="submit">保存</button>
            <button class="layui-btn layui-btn-danger" type="button" data-close>取消</button>
        </div>
    </div>
</form>
