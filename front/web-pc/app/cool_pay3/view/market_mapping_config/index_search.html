<form class="layui-form layui-form-pane form-search" action="{:request()->url()}" onsubmit="return false" method="get"
      autocomplete="off">
    <div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">市场ID(group_id)</label>
        <div class="layui-input-inline">
            <input name="group_id" value="{$get.group_id|default=''}" placeholder="请输入group_id"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">Outcome ID(market_id)</label>
        <div class="layui-input-inline">
            <input name="market_id" value="{$get.market_id|default=''}" placeholder="请输入market_id"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">市场名称(market_name)</label>
        <div class="layui-input-inline">
            <input name="market_name" value="{$get.market_name|default=''}" placeholder="请输入市场名称(market_name)"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">outcome_name</label>
        <div class="layui-input-inline">
            <input name="outcome_name" value="{$get.outcome_name|default=''}" placeholder="请输入outcome_name"
                   class="layui-input">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">市场状态(market_status)</label>
        <div class="layui-input-inline">
            <select name="market_status" class="layui-select">
                <option value="">全部</option>
                {foreach $statuses as $key=>$item}
                <option value="{$key}" {if isset($get.market_status) && $get.market_status==$key}selected{/if}>{$item}</option>
                {/foreach}
            </select>
        </div>
    </div>
</div>
    <div class="layui-form-item layui-inline">
        <label class="layui-form-label">创建时间(created_at)</label>
        <div class="layui-input-inline">
            <input name="date_range" value="{$get.date_range|default=''}" placeholder="请选择日期范围(created_at)"
                   class="layui-input" id="date_range">
        </div>
    </div>
    <div class="layui-form-item layui-inline">
        <button class="layui-btn layui-btn-primary"><i class="layui-icon">&#xe615;</i> 搜 索</button>
        <button class="layui-btn layui-btn-sm layui-btn-primary" data-modal='{:url("add")}'><i class="layui-icon">&#xe654;</i> 新增关联</button>
    </div>
</form>

<script>
    layui.use(['form', 'laydate'], function () {
        var form = layui.form;
        var laydate = layui.laydate;

        laydate.render({
            elem: '#date_range',
            type: 'date',
            range: ' - ',
            format: 'yyyy-MM-dd'
        });
    });
</script>
